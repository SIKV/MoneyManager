name: build-android-dev
on:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    name: Build Android (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.38.5

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test -j 1

      - run: flutter build apk --release --split-per-abi --flavor dev --android-project-arg qa

      - name: Upload armeabi-v7a artifact
        uses: actions/upload-artifact@v7
        with:
          name: MoneyManager-dev-armeabi-v7a.apk
          path: build/app/outputs/apk/dev/release/app-dev-armeabi-v7a-release.apk

      - name: Upload arm64-v8a artifact
        uses: actions/upload-artifact@v7
        with:
          name: MoneyManager-dev-arm64-v8a.apk
          path: build/app/outputs/apk/dev/release/app-dev-arm64-v8a-release.apk
